name: Update dashboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_dashboard.py
      - .github/workflows/update-dashboard.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard
        env:
          # Add a GH_STATS_TOKEN secret to include private contributions.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python scripts/generate_dashboard.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --cached --quiet || git commit -m "chore: update dashboard"
          git push
